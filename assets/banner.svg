<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f16"/>
      <stop offset="55%" stop-color="#123524"/>
      <stop offset="100%" stop-color="#0b1f16"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="100%" stop-color="#3DDC84"/>
