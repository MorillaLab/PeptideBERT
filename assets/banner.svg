  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="220" fill="url(#glow)"/>
  <circle cx="220" cy="260" r="180" fill="url(#glow)"/>

  <!-- peptide chain motif: residue beads + backbone -->
  <g stroke="url(#chain)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 60 250 Q 140 190 220 250 T 380 250 T 540 250 T 700 250" />
  </g>
  <g fill="url(#chain)">
    <circle cx="60" cy="250" r="7"/>
    <circle cx="140" cy="205" r="7"/>
    <circle cx="220" cy="250" r="7"/>
    <circle cx="300" cy="205" r="7"/>
    <circle cx="380" cy="250" r="7"/>
    <circle cx="460" cy="205" r="7"/>
    <circle cx="540" cy="250" r="7"/>
    <circle cx="620" cy="205" r="7"/>
    <circle cx="700" cy="250" r="7"/>
  </g>

  <!-- attention-head style connecting arcs, subtle -->
  <g stroke="#3DDC84" stroke-width="1" opacity="0.35" fill="none">
    <path d="M 140 205 C 220 120, 380 120, 460 205"/>
    <path d="M 220 250 C 340 330, 460 330, 540 250"/>
    <path d="M 60 250 C 160 60, 560 60, 700 250"/>
  </g>

  <text x="60" y="130" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#EAFBF1">
